<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Main Wallet Body -->
  <g transform="translate(96, 120)">
    <!-- Back card -->
    <rect x="48" y="16" width="224" height="130" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" />
    
    <!-- Front Wallet Leather -->
    <rect x="0" y="56" width="320" height="210" rx="32" fill="#0f172a" fill-opacity="0.85" stroke="#34d399" stroke-width="6" />
    
    <!-- Wallet Flap Pocket -->
    <path d="M 210,130 L 316,130 C 320,130 320,190 316,190 L 210,190 C 195,190 195,130 210,130 Z" fill="#059669" stroke="#34d399" stroke-width="4" />
    <circle cx="225" cy="160" r="10" fill="#fef08a" />

    <!-- Growth Arrow / Financial Trend -->
    <path d="M 40,200 L 90,150 L 130,175 L 185,115" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="155,115 185,115 185,145" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Currency / Sparkle Accent -->
  <circle cx="395" cy="115" r="16" fill="#34d399" />
  <circle cx="115" cy="395" r="12" fill="#10b981" opacity="0.6" />
</svg>
